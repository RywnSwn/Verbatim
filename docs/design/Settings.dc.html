<label for="tname" style="text-align: right; padding-top: 4px">Teacher name:</label>
<div><input id="tname" value="Mr. Yurt" style="width: 220px; height: 24px; border: 1px solid #c7c7cc; border-radius: 5px; padding: 0 7px; font-size: 13px; color: #1c1c1e"></div>

<label for="sname" style="text-align: right; padding-top: 4px">Students show as:</label>
<div><input id="sname" value="Student" style="width: 220px; height: 24px; border: 1px solid #c7c7cc; border-radius: 5px; padding: 0 7px; font-size: 13px; color: #1c1c1e"></div>

<label for="mic" style="text-align: right; padding-top: 4px">Microphone:</label>
<div style="display: flex; flex-direction: column; gap: 4px">
<select id="mic" style="width: 220px; height: 24px; border: 1px solid #c7c7cc; border-radius: 5px; font-size: 13px; background: #ffffff; color: #1c1c1e"><option>MacBook mic</option></select>

<div style="grid-column: 1 / span 2; height: 1px; background: #e2e2e6; margin: 6px 40px"></div>

<label style="display: flex; gap: 6px; align-items: center"><input type="radio" name="ts">Time since start (00:37)</label>
</div>

<span style="text-align: right">When copying:</span>
<label style="display: flex; gap: 6px; align-items: center"><input type="checkbox">Include timestamps</label>

<div style="grid-column: 1 / span 2; height: 1px; background: #e2e2e6; margin: 6px 40px"></div>

<span style="text-align: right">Shortcuts:</span>
<div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); row-gap: 5px">
<span style="color: #55555a">⌘R</span><span>Start or stop recording</span>
<span style="color: #55555a">⇧⌘P</span><span>Pause or resume</span>
<span style="color: #55555a">⌘D</span><span>Add marker</span>
<span style="color: #55555a">⌥⌘C</span><span>Copy new lines</span>
