<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verbatim: recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#1c1c1e}
a{color:#0a5fd1}a:hover{color:#074aa3}
button{font-family:inherit}
button:focus-visible{outline:3px solid #0a64d8;outline-offset:2px}
.tb:hover{background:#e8e8ec}
.tb:active{background:#d8d8de}
.mi:hover{background:#0a64d8;color:#ffffff}
.mi:hover .sc{color:#ffffff}
.side:hover{background:#e4e4e9}
</style>
</helmet>
<div style="width: 1200px; height: 780px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #d1d1d6; position: relative">

<div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #e2e2e6; background: #f7f7f8">
<div style="display: flex; gap: 8px; width: 60px" aria-hidden="true">
<div style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></div>
<div style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></div>
<div style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></div>
</div>
<button class="tb" aria-label="Show or hide sidebar" style="width: 32px; height: 28px; border: none; background: transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #55555a">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
</button>
<div style="margin-left: 150px; display: flex; flex-direction: column; line-height: 1.2">
<span style="font-size: 14px; font-weight: 600">English, Mon 10 Nov</span>
<span style="font-size: 11px; color: #6c6c70">Mr. Yurt, started 10:05</span>
</div>
<div style="flex: 1"></div>
<button class="tb" onClick="{{addMarker}}" style="height: 30px; padding: 0 10px; border: none; background: transparent; border-radius: 6px; display: flex; align-items: center; gap: 6px; color: #1c1c1e; font-size: 13px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
Marker <span style="color: #6c6c70; font-size: 12px">⌘D</span>
</button>
<button class="tb" aria-label="Search transcript" style="width: 32px; height: 30px; border: none; background: transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #55555a">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><line x1="16" y1="16" x2="20.5" y2="20.5"></line></svg>
</button>
<button class="tb" aria-label="Export" style="width: 32px; height: 30px; border: none; background: transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #55555a">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 14v6h14v-6"></path></svg>
</button>
<div style="display: flex; align-items: stretch; height: 30px; border-radius: 7px; overflow: hidden; background: #0a64d8">
<button onClick="{{copyAll}}" style="border: none; background: transparent; color: #ffffff; font-size: 13px; font-weight: 500; padding: 0 12px; display: flex; align-items: center; gap: 6px; min-width: 150px; justify-content: center">
<sc-if value="{{copied}}" hint-placeholder-val="{{ false }}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
<span>{{copiedLabel}}</span>
</sc-if>
<sc-if value="{{notCopied}}" hint-placeholder-val="{{ true }}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>
<span>Copy all</span>
</sc-if>
</button>
<button onClick="{{toggleMenu}}" aria-label="More copy options" style="border: none; border-left: 1px solid #3d84e0; background: transparent; color: #ffffff; width: 28px; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
</div>

<div style="flex: 1; display: flex; min-height: 0">

<div style="width: 240px; flex-shrink: 0; background: #f2f2f4; border-right: 1px solid #e2e2e6; padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; color: #6c6c70; padding: 6px 8px">Today</div>
<button class="side" style="text-align: left; border: none; background: #dedee3; border-radius: 7px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: #1c1c1e">English</span>
<span style="font-size: 11px; color: #55555a">Recording now, 37 min</span>
</button>
<div style="font-size: 11px; font-weight: 600; color: #6c6c70; padding: 14px 8px 6px">This week</div>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
<button class="side" style="text-align: left; border: none; background: transparent; border-radius: 7px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #1c1c1e">{{r.name}}</span>
<span style="font-size: 11px; color: #6c6c70">{{r.meta}}</span>
</button>
</sc-for>
<div style="flex: 1"></div>
<div style="font-size: 11px; color: #6c6c70; padding: 8px; line-height: 1.4">Drop a Voice Memo anywhere to transcribe it.</div>
</div>

<div style="flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative">
<div style="flex: 1; overflow: hidden; padding: 24px 40px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; max-width: 860px">
<sc-for list="{{accurate}}" as="l" hint-placeholder-count="6">
<div style="display: flex; gap: 14px; align-items: baseline">
<span style="width: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6c6c70; font-variant-numeric: tabular-nums">{{l.time}}
<sc-if value="{{l.marker}}" hint-placeholder-val="{{ false }}">
<svg width="11" height="11" viewBox="0 0 24 24" fill="#1c1c1e" stroke="#1c1c1e" stroke-width="2" role="img" aria-label="Marker"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
</sc-if>
</span>
<div style="flex: 1; font-size: 15px; line-height: 1.5"><span style="font-weight: 650">{{l.speaker}}:</span> {{l.text}}</div>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 10px; margin: 2px 0 0 66px" role="separator" aria-label="Checked text ends at 10:40">
<span style="font-size: 11px; color: #6c6c70">Checked up to 10:40</span>
<div style="flex: 1; height: 1px; background: #e2e2e6"></div>
</div>
<sc-for list="{{live}}" as="l" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; align-items: baseline">
<span style="width: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6c6c70; font-variant-numeric: tabular-nums">{{l.time}}
<sc-if value="{{l.marker}}" hint-placeholder-val="{{ false }}">
<svg width="11" height="11" viewBox="0 0 24 24" fill="#1c1c1e" stroke="#1c1c1e" stroke-width="2" role="img" aria-label="Marker"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
</sc-if>
</span>
<div style="flex: 1; font-size: 15px; line-height: 1.5; color: #5d5d62"><span style="font-weight: 650">{{l.speaker}}:</span> {{l.text}}</div>
</div>
</sc-for>
</div>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 6px; right: 14px; width: 270px; background: #ffffff; border: 1px solid #d1d1d6; border-radius: 9px; box-shadow: 0 8px 28px rgba(0,0,0,0.16); padding: 5px; display: flex; flex-direction: column" role="menu">
<button class="mi" role="menuitem" onClick="{{copyAll}}" style="border: none; background: transparent; text-align: left; font-size: 13px; padding: 6px 10px; border-radius: 5px; display: flex; justify-content: space-between; color: #1c1c1e">Copy all<span class="sc" style="color: #6c6c70">⇧⌘C</span></button>
<button class="mi" role="menuitem" onClick="{{copyNew}}" style="border: none; background: transparent; text-align: left; font-size: 13px; padding: 6px 10px; border-radius: 5px; display: flex; justify-content: space-between; color: #1c1c1e">Copy new since last copy<span class="sc" style="color: #6c6c70">⌥⌘C</span></button>
<button class="mi" role="menuitem" onClick="{{copyTen}}" style="border: none; background: transparent; text-align: left; font-size: 13px; padding: 6px 10px; border-radius: 5px; color: #1c1c1e">Copy last 10 minutes</button>
<div style="height: 1px; background: #e2e2e6; margin: 4px 6px"></div>
<button class="mi" role="menuitem" onClick="{{copyMarkers}}" style="border: none; background: transparent; text-align: left; font-size: 13px; padding: 6px 10px; border-radius: 5px; color: #1c1c1e">Copy marked parts only</button>
</div>
</sc-if>
</div>
</div>

<div style="height: 64px; flex-shrink: 0; border-top: 1px solid #e2e2e6; background: #f7f7f8; display: flex; align-items: center; padding: 0 20px; gap: 18px">
<div style="display: flex; align-items: baseline; gap: 8px; width: 150px">
<span style="font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; color: {{timerColor}}">00:37:12</span>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 600; color: #55555a">Paused</span>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 3px; height: 26px; width: 210px; overflow: hidden" role="img" aria-label="{{waveLabel}}">
<sc-for list="{{wave}}" as="w" hint-placeholder-count="40">
<div style="flex-shrink: 0; width: {{w.w}}; height: {{w.h}}; border-radius: 2px; background: {{w.c}}"></div>
</sc-for>
</div>
<div style="flex: 1; display: flex; justify-content: center; gap: 10px">
<button class="tb" onClick="{{togglePause}}" style="height: 36px; padding: 0 16px; border: 1px solid #c7c7cc; background: #ffffff; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; color: #1c1c1e">
<sc-if value="{{notPaused}}" hint-placeholder-val="{{ true }}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"></rect><rect x="14" y="4" width="5" height="16" rx="1"></rect></svg>Pause <span style="color: #6c6c70; font-size: 12px">⇧⌘P</span>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>Resume <span style="color: #6c6c70; font-size: 12px">⇧⌘P</span>
</sc-if>
</button>
<button class="tb" style="height: 36px; padding: 0 16px; border: 1px solid #c7c7cc; background: #ffffff; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; color: #1c1c1e">
<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>Stop <span style="color: #6c6c70; font-size: 12px">⌘R</span>
</button>
</div>
<div style="width: 280px; text-align: right; font-size: 12px; color: #55555a; line-height: 1.4" aria-live="polite">
<div style="display: flex; justify-content: flex-end; gap: 10px; align-items: baseline"><span style="color: {{statusColor}}">{{status}}</span><sc-if value="{{hasLink}}" hint-placeholder-val="{{ false }}"><button style="border: none; background: transparent; color: #0a5fd1; font-size: 12px; font-weight: 600; padding: 0">{{msgLink}}</button></sc-if></div>
<div style="color: #6c6c70; font-size: 11px">Saved as you go, works offline</div>
</div>
</div>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: #2c2c2e; color: #ffffff; font-size: 13px; padding: 9px 16px; border-radius: 9px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.2)">
<span>{{toastText}}</span>
<button onClick="{{undoMarker}}" style="border: none; background: transparent; color: #8ab8ff; font-size: 13px; font-weight: 600; padding: 2px 4px">Undo</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"msg":{"editor":null},"msgLink":{"editor":null},"$preview":{"width":1200,"height":780}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const seed = [0,0,0,0,6,12,18,9,0,0,14,20,16,8,0,0,0,10,22,15,7,0,0,0,0,8,16,11,0,0,12,18,24,14,9,0,0,0,7,13];
    this.state = { paused: false, menuOpen: false, copied: '', extraMarker: false, toast: '', levels: seed };
    this.timer = null;
    this.iv = null;
    this.talk = 0;
  }
  componentDidMount() {
    this.iv = setInterval(() => {
      if (this.state.paused) return;
      if (this.talk <= 0 && Math.random() < 0.3) this.talk = 4 + Math.floor(Math.random() * 8);
      let v = 0;
      if (this.talk > 0) { this.talk -= 1; v = 5 + Math.floor(Math.random() * 20); }
      this.setState({ levels: this.state.levels.slice(1).concat([v]) });
    }, 120);
  }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.timer); }
  flash(label) {
    this.setState({ copied: label, menuOpen: false });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.setState({ copied: '' }), 1800);
  }
  renderVals() {
    const s = this.state;
    const wave = s.levels.map((h) => {
      if (s.paused || h === 0) return { w: '3px', h: '3px', c: '#c7c7cc' };
      return { w: '3px', h: h + 'px', c: '#8e8e93' };
    });
    return {
      paused: s.paused,
      notPaused: !s.paused,
      timerColor: s.paused ? '#6c6c70' : '#1c1c1e',
      wave: wave,
      waveLabel: s.paused ? 'Paused, not listening' : 'Listening',
      status: this.props.msg || (s.paused ? 'Paused. Checking catches up meanwhile.' : 'Checking 10:40 to 10:45'),
      statusColor: this.props.msg ? '#1c1c1e' : '#55555a',
      hasLink: !!this.props.msgLink,
      msgLink: this.props.msgLink || '',
      menuOpen: s.menuOpen,
      copied: !!s.copied,
      notCopied: !s.copied,
      copiedLabel: s.copied,
      showToast: !!s.toast,
      toastText: s.toast,
      recent: [
        { name: 'English', meta: 'Fri 7 Nov, 52 min' },
        { name: 'English', meta: 'Thu 6 Nov, 48 min' },
        { name: 'English', meta: 'Wed 5 Nov, audio deletes in 3 days' },
        { name: 'Voice Memo test', meta: 'Tue 4 Nov, audio deleted' }
      ],
      accurate: [
        { time: '10:31', speaker: 'Mr. Yurt', text: '"Okay, let’s go back to where we stopped on Friday. Anansi has just made his deal with Nyankupon, the sky god."', marker: false },
        { time: '10:32', speaker: 'Student', text: '"Wait, why does he want the stories in the first place?"', marker: false },
        { time: '10:32', speaker: 'Mr. Yurt', text: '"Good question. Owning the stories means owning a kind of power. Keep that in mind, it comes back later."', marker: false },
        { time: '10:34', speaker: 'Mr. Yurt', text: '"Write this down: the price Nyankupon sets is meant to be impossible."', marker: true },
        { time: '10:36', speaker: 'Student', text: '"So it’s basically a test of how clever he is."', marker: false },
        { time: '10:37', speaker: 'Mr. Yurt', text: '"Exactly. Now compare that with the Kweku Tsin story from last week."', marker: false }
      ],
      live: [
        { time: '10:40', speaker: 'Mr. Yurt', text: '"So what makes a trickster different from a villain? Think about that for a second."', marker: false },
        { time: '10:41', speaker: 'Student', text: '"Maybe because the trickster is kind of the hero, even when he cheats?"', marker: false },
        { time: '10:41', speaker: 'Mr. Yurt', text: '"Mm, keep going with that, why would the audience still be on his side"', marker: s.extraMarker }
      ],
      togglePause: () => this.setState({ paused: !s.paused }),
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      copyAll: () => this.flash('Copied 58 lines'),
      copyNew: () => this.flash('Copied 9 new lines'),
      copyTen: () => this.flash('Copied last 10 min'),
      copyMarkers: () => this.flash('Copied 2 marked parts'),
      addMarker: () => this.setState({ extraMarker: true, toast: 'Marker added at 10:41' }),
      undoMarker: () => this.setState({ extraMarker: false, toast: '' })
    };
  }
}
</script>
</body>
</html>
