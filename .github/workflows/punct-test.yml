name: Punctuation test

# Not part of the app. Runs a real recording through Parakeet four ways and
# prints the text, to compare capitals, commas and quotes (2026-11-20).
on:
  push:
    paths:
      - tools/PunctTest/**
      - .github/workflows/punct-test.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Get the audio
        run: |
          mkdir -p audio
          # LibriVox (public domain): West African Folk Tales, ch. 4 "Thunder and Anansi".
          curl -sSL --retry 4 -o audio/story.mp3 \
            "https://archive.org/download/west_african_folk_tales_librivox/westafricanfolktales_04_barker_64kb.mp3"
          ls -l audio
          command -v ffmpeg || brew install ffmpeg
          # Fake classroom: quieter, room echo, steady background noise.
          ffmpeg -hide_banner -loglevel error -i audio/story.mp3 -filter_complex \
            "[0:a]aresample=16000,aecho=0.8:0.6:40|70:0.35|0.25,volume=0.35[s];anoisesrc=color=pink:amplitude=0.02:sample_rate=16000[n];[s][n]amix=inputs=2:duration=first:normalize=0" \
            -ac 1 -ar 16000 audio/classroom.wav
          ls -l audio

      - name: Build
        working-directory: tools/PunctTest
        run: swift build -c release

      - name: Run
        working-directory: tools/PunctTest
        run: |
          .build/release/PunctTest ../../audio/story.mp3 ../../audio/classroom.wav | tee "$RUNNER_TEMP/out.txt"
          { echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: punct-test
          path: ${{ runner.temp }}/out.txt
