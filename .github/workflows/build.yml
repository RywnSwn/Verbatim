name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Tool versions
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P verbatim -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -p codesigning "$KC" | awk '/Verbatim/ {print $2; exit}')
          echo "Signing identity: $ID"
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build Verbatim.app
        run: scripts/build-app.sh "0.1.${{ github.run_number }}" "${{ github.run_number }}"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            FLAGS="--latest"
            NOTE="Download Verbatim.zip below, unzip it, and move Verbatim to Applications."
          else
            FLAGS="--prerelease"
            NOTE="Test build from branch ${{ github.ref_name }}. Download Verbatim.zip below, unzip it, and move Verbatim to Applications."
          fi
          gh release create "$TAG" build/Verbatim.zip \
            --target "${{ github.sha }}" \
            --title "Verbatim 0.1.${{ github.run_number }}" \
            --notes "$NOTE" \
            $FLAGS
